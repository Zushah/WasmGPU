<html>
    <head>
        <meta charset="utf-8">
        <title>WasmGPU | Terrain Example</title>
        <link rel="icon" type="image/png" href="../assets/favicon.png">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: #000; overflow: hidden; color: #d8e2ef; font: 12px/1.4 monospace; }
            canvas { display: block; width: 100vw; height: 100vh; }
            .hud { position: fixed; left: 10px; top: 10px; width: 250px; z-index: 6; pointer-events: none; }
            .pane { padding: 10px; background: rgba(5, 10, 18, 0.78); border: 1px solid rgba(180, 210, 255, 0.2); }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <div class="hud">
            <div class="pane">Click terrain to lock pointer<br>W/A/S/D move<br>Q/E down/up<br>Z/C roll<br>Shift faster, Alt slower<br>Wheel changes move speed<br>Esc unlocks pointer</div>
        </div>
        <script src="../dist/WasmGPU.iife.min.js"></script>
        <script type="module">
            const WORLD_SIZE = 100.0;
            const HALF = WORLD_SIZE * 0.5;
            const HEIGHTFIELD_RESOLUTION = 1000;
            const TERRAIN_RESOLUTION = 500;
            const SPLAT_COUNT = 120000;

            const mulberry32 = (seed) => () => { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const rng = mulberry32(42);
            const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
            const mix = (a, b, t) => a + (b - a) * t;
            const smoothstep = (edge0, edge1, x) => { const t = clamp((x - edge0) / (edge1 - edge0), 0, 1); return t * t * (3 - 2 * t); };
            const hash2 = (ix, iz) => { let h = Math.imul(ix, 374761393) ^ Math.imul(iz, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
            const noise = (x, z) => {
                const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
                const a = mix(hash2(ix, iz), hash2(ix + 1, iz), sx), b = mix(hash2(ix, iz + 1), hash2(ix + 1, iz + 1), sx);
                return mix(a, b, sz) * 2 - 1;
            };
            const fbm = (x, z) => {
                let sum = 0, amp = 0.5, freq = 1;
                for (let i = 0; i < 6; i++) { sum += amp * noise(x * freq, z * freq); freq *= 2.03; amp *= 0.52; }
                return sum;
            };
            const ridged = (x, z) => {
                let sum = 0, amp = 0.62, freq = 1;
                for (let i = 0; i < 6; i++) { const n = Math.abs(noise(x * freq, z * freq)); sum += amp * Math.pow(1 - n, 2.15); freq *= 2.06; amp *= 0.49; }
                return sum;
            };
            const rangeBand = (x, z, angle, offset, width) => { const d = (Math.cos(angle) * x + Math.sin(angle) * z - offset) / width; return Math.exp(-d * d); };
            const valleyLine = (x, z, angle, offset, warp, width) => { const d = Math.cos(angle) * x + Math.sin(angle) * z - offset + warp; return Math.exp(-(d * d) / (2 * width * width)); };
            const peak = (x, z, cx, cz, sx, sz, h) => { const dx = (x - cx) / sx, dz = (z - cz) / sz; return h * Math.exp(-(dx * dx + dz * dz)); };
            const createPeakField = (count) => {
                const r = mulberry32(992311);
                const out = [];
                for (let i = 0; i < count; i++) {
                    const x = (r() * 2 - 1) * (HALF * 0.94), z = (r() * 2 - 1) * (HALF * 0.94);
                    const band = rangeBand(x, z, 0.80, -14.0, 9.2) + rangeBand(x, z, 0.72, 2.5, 7.6) + rangeBand(x, z, 0.92, 16.0, 8.0) + rangeBand(x, z, 1.08, 28.0, 8.8);
                    if (band < 0.18 && i < count - 10) { i--; continue; }
                    out.push({ x, z, sx: 3.4 + r() * 5.4, sz: 3.1 + r() * 5.9, h: 1.5 + r() * 4.6 });
                }
                return out;
            };
            const peaks = createPeakField(52);
            const terrainHeightRaw = (x, z) => {
                const wx = x + 3.7 * fbm(x * 0.040 + 13.1, z * 0.040 - 7.7);
                const wz = z + 3.7 * fbm(x * 0.040 - 33.0, z * 0.040 + 18.4);
                const macro = 0.55 + 0.45 * smoothstep(-0.32, 0.55, fbm(wx * 0.040, wz * 0.040));
                const bands = 0.74 * rangeBand(wx, wz, 0.78, -15.5, 8.4) + 0.92 * rangeBand(wx, wz, 0.66, -3.0, 6.7) + 0.85 * rangeBand(wx, wz, 0.86, 9.0, 7.4) + 0.58 * rangeBand(wx, wz, 1.02, 19.5, 8.0) + 0.44 * rangeBand(wx, wz, 1.12, 31.0, 9.6);
                const mountainMask = clamp(0.16 + bands + 0.34 * macro, 0, 1.75);
                const ridgeField = ridged(wx * 0.070 + 8.0, wz * 0.070 - 5.0);
                const longRidge = ridged(wx * 0.030 - 21.0, wz * 0.030 + 11.0);
                const valleyWarp = 3.0 * fbm(wx * 0.052 + 1.7, wz * 0.052 - 5.0);
                const valleys = clamp(0.62 * valleyLine(wx, wz, 0.30, -10.0, valleyWarp, 1.35) + 0.70 * valleyLine(wx, wz, 0.88, -4.0, -0.7 * valleyWarp, 1.25) + 0.58 * valleyLine(wx, wz, 1.34, 4.5, 0.55 * valleyWarp, 1.38) + 0.62 * valleyLine(wx, wz, 2.04, 11.5, -0.45 * valleyWarp, 1.50) + 0.50 * valleyLine(wx, wz, 2.58, 22.0, 0.35 * valleyWarp, 1.70) + 0.46 * Math.exp(-Math.pow(Math.abs(fbm(wx * 0.085 + 44.0, wz * 0.085 - 14.0)) / 0.20, 2)), 0, 1.8);
                let peaksH = 0;
                for (let i = 0; i < peaks.length; i++) { const p = peaks[i]; peaksH += peak(wx, wz, p.x, p.z, p.sx, p.sz, p.h); }
                const base = 0.55 + 1.35 * fbm(wx * 0.023 - 9.0, wz * 0.023 + 4.0);
                const folded = 2.4 * longRidge * (0.4 + mountainMask * 0.65);
                const sharp = 4.7 * ridgeField * mountainMask;
                const detail = 0.50 * fbm(wx * 0.19 + 3.0, wz * 0.19 - 6.0) + 0.18 * fbm(wx * 0.62, wz * 0.62);
                let h = 0.65 + base + folded + sharp + 0.55 * peaksH + detail;
                h -= valleys * (1.05 + 0.16 * Math.max(0, h));
                return Math.max(-0.25, h);
            };
            const createHeightfield = (resolution, width, depth) => {
                const count = resolution * resolution;
                const heights = new Float32Array(count);
                const normals = new Float32Array(count * 3);
                const cellX = width / (resolution - 1);
                const cellZ = depth / (resolution - 1);
                for (let iz = 0; iz < resolution; iz++) {
                    const z = (iz / (resolution - 1) - 0.5) * depth;
                    for (let ix = 0; ix < resolution; ix++) { const x = (ix / (resolution - 1) - 0.5) * width; heights[ix + iz * resolution] = terrainHeightRaw(x, z); }
                }
                const heightAt = (ix, iz) => heights[clamp(ix, 0, resolution - 1) + clamp(iz, 0, resolution - 1) * resolution];
                for (let iz = 0; iz < resolution; iz++) {
                    for (let ix = 0; ix < resolution; ix++) {
                        const l = heightAt(ix - 1, iz), r = heightAt(ix + 1, iz), d = heightAt(ix, iz - 1), u = heightAt(ix, iz + 1);
                        const dx = (r - l) / (cellX * (ix === 0 || ix === resolution - 1 ? 1 : 2)), dz = (u - d) / (cellZ * (iz === 0 || iz === resolution - 1 ? 1 : 2));
                        const nx = -dx, ny = 1, nz = -dz;
                        const inv = 1 / Math.hypot(nx, ny, nz);
                        const o = (ix + iz * resolution) * 3;
                        normals[o + 0] = nx * inv; normals[o + 1] = ny * inv; normals[o + 2] = nz * inv;
                    }
                }
                return { resolution, width, depth, cellX, cellZ, heights, normals };
            };
            const sampleScalarGrid = (data, components, hf, x, z, component = 0) => {
                const r = hf.resolution;
                const gx = clamp((x / hf.width + 0.5) * (r - 1), 0, r - 1), gz = clamp((z / hf.depth + 0.5) * (r - 1), 0, r - 1);
                const ix = Math.floor(gx), iz = Math.floor(gz), ix1 = Math.min(r - 1, ix + 1), iz1 = Math.min(r - 1, iz + 1);
                const tx = gx - ix, tz = gz - iz;
                const base00 = (ix + iz * r) * components + component, base10 = (ix1 + iz * r) * components + component, base01 = (ix + iz1 * r) * components + component, base11 = (ix1 + iz1 * r) * components + component;
                const a = mix(data[base00], data[base10], tx), b = mix(data[base01], data[base11], tx);
                return mix(a, b, tz);
            };
            const sampleHeight = (hf, x, z) => sampleScalarGrid(hf.heights, 1, hf, x, z, 0);
            const sampleNormal = (hf, x, z) => { const nx = sampleScalarGrid(hf.normals, 3, hf, x, z, 0), ny = sampleScalarGrid(hf.normals, 3, hf, x, z, 1), nz = sampleScalarGrid(hf.normals, 3, hf, x, z, 2); const inv = 1 / Math.hypot(nx, ny, nz); return [nx * inv, ny * inv, nz * inv]; };
            const createTerrain = (nx, nz, hf) => {
                const positions = new Float32Array(nx * nz * 3), normals = new Float32Array(nx * nz * 3), uvs = new Float32Array(nx * nz * 2), indices = new Uint32Array((nx - 1) * (nz - 1) * 6);
                let p = 0, n = 0, u = 0;
                for (let iz = 0; iz < nz; iz++) {
                    const z = (iz / (nz - 1) - 0.5) * hf.depth;
                    for (let ix = 0; ix < nx; ix++) {
                        const x = (ix / (nx - 1) - 0.5) * hf.width, y = sampleHeight(hf, x, z), normal = sampleNormal(hf, x, z);
                        positions[p++] = x; positions[p++] = y; positions[p++] = z;
                        normals[n++] = normal[0]; normals[n++] = normal[1]; normals[n++] = normal[2];
                        uvs[u++] = ix / (nx - 1); uvs[u++] = iz / (nz - 1);
                    }
                }
                let k = 0;
                for (let iz = 0; iz < nz - 1; iz++) {
                    for (let ix = 0; ix < nx - 1; ix++) {
                        const a = ix + nx * iz, b = ix + nx * (iz + 1), c = ix + 1 + nx * (iz + 1), d = ix + 1 + nx * iz;
                        indices[k++] = a; indices[k++] = b; indices[k++] = d;
                        indices[k++] = b; indices[k++] = c; indices[k++] = d;
                    }
                }
                return { positions, normals, uvs, indices };
            };
            const quatFromAxisAngle = (axis, angle) => { const len = Math.hypot(axis[0], axis[1], axis[2]) || 1; const s = Math.sin(angle * 0.5) / len; return [axis[0] * s, axis[1] * s, axis[2] * s, Math.cos(angle * 0.5)]; };
            const writeSplat = (out, i, p, scale, quat, color, opacity) => {
                const a = i * 3, b = i * 4;
                out.positions[a + 0] = p[0]; out.positions[a + 1] = p[1]; out.positions[a + 2] = p[2];
                out.scales[a + 0] = scale[0]; out.scales[a + 1] = scale[1]; out.scales[a + 2] = scale[2];
                out.rotations[b + 0] = quat[0]; out.rotations[b + 1] = quat[1]; out.rotations[b + 2] = quat[2]; out.rotations[b + 3] = quat[3];
                out.colors[b + 0] = color[0]; out.colors[b + 1] = color[1]; out.colors[b + 2] = color[2]; out.colors[b + 3] = color[3];
                out.opacities[i] = opacity;
            };
            const sampleLayerPoint = (index, candidates, range, salt) => {
                const cols = Math.ceil(Math.sqrt(candidates));
                const wrapped = (index + salt) % (cols * cols);
                const cx = wrapped % cols, cz = Math.floor(wrapped / cols);
                return [((cx + rng()) / cols * 2 - 1) * range, ((cz + rng()) / cols * 2 - 1) * range];
            };
            const fillLayer = (out, start, end, range, candidateFactor, tryWrite) => {
                let i = start;
                const needed = end - start;
                const candidates = Math.max(needed, Math.ceil(needed * candidateFactor));
                const salt = Math.floor(rng() * candidates);
                for (let c = 0; i < end && c < candidates; c++) { const p = sampleLayerPoint(c, candidates, range, salt); if (tryWrite(out, i, p[0], p[1], false)) i++; }
                let guard = 0;
                while (i < end && guard++ < needed * 16) { const x = (rng() * 2 - 1) * range, z = (rng() * 2 - 1) * range; if (tryWrite(out, i, x, z, true)) i++; }
                while (i < end) { const x = (rng() * 2 - 1) * range, z = (rng() * 2 - 1) * range; if (tryWrite(out, i, x, z, true, true)) i++; }
                return i;
            };
            const createLandSplats = (count, hf) => {
                const out = { positions: new Float32Array(count * 3), rotations: new Float32Array(count * 4), scales: new Float32Array(count * 3), opacities: new Float32Array(count), colors: new Float32Array(count * 4) };
                const range = Math.min(hf.width, hf.depth) * 0.5 - 1.1;
                const forestTarget = Math.floor(count * 0.66), meadowTarget = Math.floor(count * 0.77), screeTarget = Math.floor(count * 0.90);
                let i = 0;
                i = fillLayer(out, i, forestTarget, range, 4.8, (out, idx, x, z, relaxed, forced = false) => {
                    const h = sampleHeight(hf, x, z), n = sampleNormal(hf, x, z);
                    const treeLine = (1 - smoothstep(4.2, 6.5, h)) * smoothstep(0.15, 1.3, h);
                    const slopeOk = smoothstep(0.42, 0.91, n[1]);
                    const valleyWet = smoothstep(0.25, 0.93, Math.exp(-Math.pow(Math.abs(fbm(x * 0.082 + 18.0, z * 0.082 - 9.0)) / 0.34, 2)));
                    const patch = smoothstep(-0.55, 0.55, fbm(x * 0.34 + 7.0, z * 0.34 - 2.0));
                    const suitability = treeLine * slopeOk * (0.42 + 0.58 * valleyWet) * (0.45 + 0.55 * patch);
                    if (!forced && rng() > suitability * (relaxed ? 0.95 : 0.76)) return false;
                    const shade = 0.66 + rng() * 0.48;
                    const y = h + 0.10 + rng() * 0.38;
                    writeSplat(out, idx, [x, y, z], [0.11 + rng() * 0.10, 0.19 + rng() * 0.24, 0.11 + rng() * 0.10], quatFromAxisAngle([0, 1, 0], rng() * Math.PI * 2), [0.030 * shade, 0.130 * shade, 0.048 * shade, 1], 0.10 + rng() * 0.08);
                    return true;
                });
                i = fillLayer(out, i, meadowTarget, range, 3.2, (out, idx, x, z, relaxed, forced = false) => {
                    const h = sampleHeight(hf, x, z), n = sampleNormal(hf, x, z);
                    const meadow = smoothstep(0.15, 1.3, h) * (1 - smoothstep(3.7, 6.5, h)) * smoothstep(0.55, 0.96, n[1]);
                    if (!forced && rng() > meadow * (relaxed ? 0.98 : 0.78)) return false;
                    const y = h + 0.060 + rng() * 0.12;
                    const tint = 0.72 + rng() * 0.42;
                    writeSplat(out, idx, [x, y, z], [0.18 + rng() * 0.16, 0.024 + rng() * 0.038, 0.18 + rng() * 0.16], quatFromAxisAngle([0, 1, 0], rng() * Math.PI * 2), [0.34 * tint, 0.36 * tint, 0.17 * tint, 1], 0.08 + rng() * 0.07);
                    return true;
                });
                i = fillLayer(out, i, screeTarget, range, 4.0, (out, idx, x, z, relaxed, forced = false) => {
                    const h = sampleHeight(hf, x, z), n = sampleNormal(hf, x, z);
                    const slope = 1 - n[1];
                    const rock = smoothstep(0.28, 0.72, slope) * smoothstep(2.3, 6.0, h) * (1 - smoothstep(10.5, 15.5, h));
                    if (!forced && rng() > rock * (relaxed ? 0.92 : 0.74)) return false;
                    const y = h + 0.07 + rng() * 0.18;
                    const c = 0.32 + rng() * 0.29;
                    writeSplat(out, idx, [x, y, z], [0.16 + rng() * 0.19, 0.026 + rng() * 0.050, 0.15 + rng() * 0.19], quatFromAxisAngle([0, 1, 0], rng() * Math.PI * 2), [c, c * 0.95, c * 0.83, 1], 0.060 + rng() * 0.065);
                    return true;
                });
                fillLayer(out, i, count, range, 4.6, (out, idx, x, z, relaxed, forced = false) => {
                    const h = sampleHeight(hf, x, z), n = sampleNormal(hf, x, z);
                    const slope = 1 - n[1];
                    const snow = clamp(smoothstep(5.0, 8.5, h) + smoothstep(0.54, 0.84, slope) * smoothstep(4.0, 6.8, h), 0, 1);
                    if (!forced && rng() > snow * (relaxed ? 0.72 : 0.52)) return false;
                    const y = h + 0.045 + rng() * 0.10;
                    const tint = 0.82 + rng() * 0.15;
                    writeSplat(out, idx, [x, y, z], [0.24 + rng() * 0.21, 0.026 + rng() * 0.032, 0.21 + rng() * 0.18], quatFromAxisAngle([0, 1, 0], rng() * Math.PI * 2), [0.88 * tint, 0.91 * tint, 0.95 * tint, 0.86], 0.035 + rng() * 0.045);
                    return true;
                });
                return out;
            };

            const wgsl = () => `
            @fragment
            fn fs_main(in: VertexOutput) -> @location(0) vec4f {
                let n = normalize(in.normal);
                let h = in.world_pos.y;
                let slope = 1.0 - clamp(n.y, 0.0, 1.0);
                let sun = normalize(vec3f(-0.42, 0.80, 0.43));
                let diffuse = max(dot(n, sun), 0.0);
                let ambient = 0.36 + 0.19 * clamp(n.y, 0.0, 1.0);
                let forest = vec3f(0.050, 0.130, 0.055);
                let meadow = vec3f(0.34, 0.39, 0.18);
                let dryGrass = vec3f(0.48, 0.41, 0.22);
                let rock = vec3f(0.39, 0.37, 0.32);
                let darkRock = vec3f(0.25, 0.25, 0.24);
                let snow = vec3f(0.88, 0.91, 0.93);
                let low = smoothstep(0.0, 2.4, h);
                let high = smoothstep(4.2, 8.2, h);
                let rockMix = clamp(smoothstep(0.25, 0.70, slope) + smoothstep(5.4, 8.5, h) * 0.45, 0.0, 1.0);
                let snowMix = clamp(smoothstep(6.0, 9.4, h) + smoothstep(0.58, 0.85, slope) * smoothstep(4.4, 7.2, h), 0.0, 1.0);
                let stripe = 0.5 + 0.5 * sin(in.world_pos.x * 1.7 + in.world_pos.z * 2.1 + h * 0.8);
                var base = mix(forest, meadow, low);
                base = mix(base, dryGrass, high * 0.38);
                base = mix(base, mix(rock, darkRock, stripe * 0.32), rockMix);
                base = mix(base, snow, snowMix);
                let light = ambient + diffuse * 0.74;
                let haze = 0.05 * smoothstep(12.0, 25.0, length(in.world_pos.xz));
                return vec4f(base * light + vec3f(haze), 1.0);
            }`;

            const canvas = document.querySelector("canvas");
            const wgpu = await WasmGPU.create(canvas, { powerPreference: "high-performance", antialias: true, frustumCulling: true });
            const scene = wgpu.createScene([0.50, 0.70, 0.85]);
            const camera = wgpu.createCamera.perspective({ fov: 30, near: 0.1, far: 500 });
            camera.transform.setPosition(-75, 50, 75);
            camera.lookAt(0, 5, 0);
            const controls = wgpu.createControls.fly(camera, canvas, {
                target: [0, 5, 0],
                pointerLock: "on-click",
                yawMode: "local",
                moveSpeed: 15,
                lookSpeed: 0.002,
                wheelSpeedFactor: 1.1,
                enableDamping: true,
                dampingFactor: 0.08,
                preventDefaultKeys: true
            });
            const heightfield = createHeightfield(HEIGHTFIELD_RESOLUTION, WORLD_SIZE, WORLD_SIZE);
            const terrain = createTerrain(TERRAIN_RESOLUTION, TERRAIN_RESOLUTION, heightfield);
            const terrainMaterial = wgpu.material.custom({ fragmentShader: wgsl() });
            scene.add(wgpu.createMesh(wgpu.geometry.custom(terrain), terrainMaterial));
            const splats = createLandSplats(SPLAT_COUNT, heightfield);
            scene.add(wgpu.createSplatField({ ...splats, colorSpace: "linear", opacityScale: 0.72, boundsMin: [-HALF, -1, -HALF], boundsMax: [HALF, 25, HALF] }));
            wgpu.run((dt) => {
                controls.update(dt);
                wgpu.render(scene, camera);
            });
        </script>
    </body>
</html>
