<html>
    <head>
        <meta charset="utf-8">
        <title>WasmGPU | Scaling Example</title>
        <link rel="icon" type="image/png" href="../assets/favicon.png">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: #05070a; overflow: hidden; color: #d8e2ef; font: 12px/1.4 monospace; }
            canvas.main { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
            .topbar { position: fixed; left: 10px; right: 10px; top: 10px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 8; }
            .topbar a { text-decoration: none; color: #d8e2ef; padding: 6px 8px; border: 1px solid rgba(180, 210, 255, 0.26); background: rgba(8, 14, 24, 0.84); }
            .topbar a.active { background: rgba(50, 95, 150, 0.46); }
            .hud { position: fixed; left: 10px; top: 52px; display: flex; flex-direction: column; gap: 10px; width: 340px; z-index: 6; }
            .pane { padding: 10px; background: rgba(5, 10, 18, 0.78); border: 1px solid rgba(180, 210, 255, 0.2); white-space: pre-line; min-height: 120px; }
            .scale-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 8px; }
            .scale-controls label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; }
            .scale-controls input, .scale-controls select, .scale-controls button { font: 11px monospace; padding: 3px; background: rgba(10, 16, 28, 0.95); color: #d8e2ef; border: 1px solid rgba(180, 210, 255, 0.25); }
            .scale-controls button { cursor: pointer; }
            .scale-controls .wide { grid-column: 1 / span 2; }
        </style>
    </head>
    <body>
        <canvas class="main"></canvas>
        <div class="topbar">
            <a href="./controls.html">controls</a>
            <a href="./picking.html">picking</a>
            <a class="active" href="./scaling.html">scaling</a>
            <a href="./overlay.html">overlay</a>
        </div>
        <div class="hud">
            <div class="pane nav"></div>
            <div class="pane scale"></div>
        </div>
        <script src="../release/WasmGPU.iife.min.js"></script>
        <script type="module">
            const canvas = document.querySelector("canvas.main");
            const navHud = document.querySelector(".nav");
            const scaleHud = document.querySelector(".scale");

            const fmt = (n, d = 3) => Number.isFinite(n) ? n.toFixed(d) : "nan";

            const generatePointCloudData = (count) => {
                const data = new Float32Array(count * 4);
                const min = [Infinity, Infinity, Infinity];
                const max = [-Infinity, -Infinity, -Infinity];
                for (let i = 0; i < count; i++) {
                    const u = i / Math.max(1, count - 1);
                    const strand = i % 3;
                    const theta = (u * 28.0) + (strand * 2.09439510239) + (Math.sin(u * 60.0) * 0.35);
                    const radius = 2.0 + (17.0 * u) + (1.75 * Math.sin((u * 18.0) + strand));
                    const jitterX = (Math.random() - 0.5) * 0.85;
                    const jitterY = (Math.random() - 0.5) * 0.85;
                    const jitterZ = (Math.random() - 0.5) * 0.85;
                    const x = (radius * Math.cos(theta)) + jitterX;
                    const y = (-14.0 + (28.0 * u)) + (3.0 * Math.sin((theta * 0.45) + strand)) + jitterY;
                    const z = (0.42 * radius * Math.sin(theta)) + (8.0 * Math.sin((u * 7.0) + strand)) + jitterZ;
                    const scalar = Math.pow(10, (u * 6.0) - 3.0) * (1.0 + (0.35 * Math.sin(theta + (u * 6.0))));
                    const o = i * 4;
                    data[o + 0] = x;
                    data[o + 1] = y;
                    data[o + 2] = z;
                    data[o + 3] = scalar;
                    if (x < min[0]) min[0] = x;
                    if (y < min[1]) min[1] = y;
                    if (z < min[2]) min[2] = z;
                    if (x > max[0]) max[0] = x;
                    if (y > max[1]) max[1] = y;
                    if (z > max[2]) max[2] = z;
                }
                return { data, boundsMin: min, boundsMax: max };
            };

            // WasmGPU: base engine + shared dataset setup.
            const wgpu = await WasmGPU.create(canvas, { powerPreference: "high-performance", antialias: true, frustumCulling: true });
            const scene = wgpu.createScene([0.02, 0.03, 0.04]);
            const perspective = wgpu.createCamera.perspective({ fov: 50, near: 0.05, far: 500 });
            const orthographic = wgpu.createCamera.orthographic({ left: -10, right: 10, top: 10, bottom: -10, near: 0.05, far: 500 });
            perspective.transform.setPosition(26, 12, 26);
            perspective.lookAt(0, 0, 0);
            orthographic.transform.copyFrom(perspective.transform);
            const controls = wgpu.createControls.navigation(perspective, canvas, {
                mode: "orbit",
                target: [0, 0, 0],
                enableDamping: true,
                dampingFactor: 0.1,
                zoomOnCursor: true,
                minDistance: 0.5,
                maxDistance: 400
            });

            const source = generatePointCloudData(100000);
            const points = wgpu.createPointCloud({
                data: source.data,
                keepCPUData: true,
                ndShape: [1000, 100],
                boundsMin: source.boundsMin,
                boundsMax: source.boundsMax,
                basePointSize: 5.0,
                minPointSize: 1.0,
                maxPointSize: 10.0,
                sizeAttenuation: 1.8,
                softness: 0.3,
                opacity: 1,
                scaleTransform: {
                    componentCount: 4,
                    componentIndex: 3,
                    valueMode: "component",
                    stride: 4,
                    offset: 0,
                    mode: "linear",
                    clampMode: "none",
                    domainMin: 0.001,
                    domainMax: 1000,
                    clampMin: 0.001,
                    clampMax: 1000,
                    percentileLow: 2,
                    percentileHigh: 98,
                    logBase: 10,
                    symlogLinThresh: 1,
                    gamma: 1,
                    invert: false
                },
                blendMode: "additive",
                colormap: "turbo"
            });
            scene.add(points);

            const scaleState = {
                stats: null,
                busy: false,
                status: "idle"
            };
            const ui = {};
            let activeCamera = perspective;
            let currentView = "front";

            const readNumber = (el, fallback) => {
                const v = Number(el.value);
                return Number.isFinite(v) ? v : fallback;
            };

            const getScaleTransformFromUI = () => {
                const componentIndex = Math.max(0, Math.min(3, Math.round(readNumber(ui.componentIndex, 3))));
                const domainMin = readNumber(ui.domainMin, 1e-3);
                const domainMax = readNumber(ui.domainMax, 1e3);
                const clampMin = readNumber(ui.clampMin, domainMin);
                const clampMax = readNumber(ui.clampMax, domainMax);
                const percentileLow = Math.max(0, Math.min(100, readNumber(ui.percentileLow, 2)));
                const percentileHigh = Math.max(percentileLow + 1e-3, Math.min(100, readNumber(ui.percentileHigh, 98)));
                return {
                    componentCount: 4,
                    componentIndex,
                    valueMode: ui.valueMode.value,
                    stride: 4,
                    offset: 0,
                    mode: ui.mode.value,
                    clampMode: ui.clampMode.value,
                    domainMin,
                    domainMax,
                    clampMin,
                    clampMax,
                    percentileLow,
                    percentileHigh,
                    logBase: Math.max(1.000001, readNumber(ui.logBase, 10)),
                    symlogLinThresh: Math.max(1e-6, readNumber(ui.symlogLinThresh, 1)),
                    gamma: Math.max(1e-6, readNumber(ui.gamma, 1)),
                    invert: !!ui.invert.checked
                };
            };

            // WasmGPU: scalar remap + colormap are demonstrated in this panel.
            const applyScaleTransformFromUI = () => {
                points.setScaleTransform(getScaleTransformFromUI());
                points.colormap = ui.colormap.value;
                refreshScalePane();
            };

            const statsSummaryLines = () => {
                if (!scaleState.stats) return ["stats: none"];
                const s = scaleState.stats;
                const pMin = s.percentileMin === null ? "null" : fmt(s.percentileMin, 6);
                const pMax = s.percentileMax === null ? "null" : fmt(s.percentileMax, 6);
                return [
                    `stats.count: ${s.count}`,
                    `stats.finiteCount: ${s.finiteCount}`,
                    `stats.min/max: ${fmt(s.min, 6)} / ${fmt(s.max, 6)}`,
                    `stats.percentileMin/max: ${pMin} / ${pMax}`,
                    `stats.bins: ${s.histogramBins ?? "null"}`
                ];
            };

            const refreshScalePane = () => {
                if (!ui.status) return;
                const transform = points.scaleTransform;
                ui.status.textContent = [
                    `status: ${scaleState.busy ? "working" : scaleState.status}`,
                    `colormap: ${points.colormap}`,
                    `active mode/clamp: ${transform.mode} / ${transform.clampMode}`,
                    `active domain: ${fmt(transform.domainMin, 6)} to ${fmt(transform.domainMax, 6)}`,
                    `active clamp: ${fmt(transform.clampMin, 6)} to ${fmt(transform.clampMax, 6)}`,
                    ...statsSummaryLines(),
                    "",
                    "GPU stats drive domain/clamp fields."
                ].join("\n");
            };

            const requestScaleStats = async (withPercentiles) => {
                const descriptor = points.getScaleSourceDescriptor();
                if (!descriptor) {
                    scaleState.status = "stats unavailable";
                    refreshScalePane();
                    return;
                }
                scaleState.busy = true;
                scaleState.status = withPercentiles ? "requesting min/max + percentiles" : "requesting min/max";
                refreshScalePane();
                try {
                    const request = {
                        source: descriptor,
                        ...(withPercentiles ? {
                            percentiles: {
                                low: readNumber(ui.percentileLow, 2),
                                high: readNumber(ui.percentileHigh, 98),
                                bins: Math.max(16, Math.floor(readNumber(ui.histogramBins, 2048)))
                            }
                        } : {})
                    };
                    // WasmGPU: scale service computes statistics on GPU buffers.
                    const stats = await wgpu.scale.requestStats(request);
                    scaleState.stats = stats;
                    scaleState.status = withPercentiles ? "stats + percentiles ready" : "stats ready";
                    ui.domainMin.value = String(stats.min);
                    ui.domainMax.value = String(stats.max);
                    if (withPercentiles && stats.percentileMin !== null && stats.percentileMax !== null) {
                        ui.clampMode.value = "percentile";
                        ui.clampMin.value = String(stats.percentileMin);
                        ui.clampMax.value = String(stats.percentileMax);
                    }
                    applyScaleTransformFromUI();
                } catch (error) {
                    scaleState.status = `stats failed: ${error?.message ?? "unknown error"}`;
                } finally {
                    scaleState.busy = false;
                    refreshScalePane();
                }
            };

            const invalidateScaleCache = () => {
                const descriptor = points.getScaleSourceDescriptor();
                if (!descriptor) {
                    scaleState.status = "invalidate skipped (no source)";
                    refreshScalePane();
                    return;
                }
                wgpu.scale.invalidate(descriptor);
                scaleState.status = "cache invalidated";
                refreshScalePane();
            };

            const setupScalePane = () => {
                scaleHud.innerHTML = `
                <div class="scale-controls">
      <label>colormap<select id="scale-colormap"><option value="turbo">turbo</option><option value="viridis">viridis</option><option value="inferno">inferno</option><option value="magma">magma</option><option value="plasma">plasma</option><option value="grayscale">grayscale</option></select></label>
                    <label>mode<select id="scale-mode"><option value="linear">linear</option><option value="log">log</option><option value="symlog">symlog</option></select></label>
                    <label>clamp<select id="scale-clamp"><option value="none">none</option><option value="range">range</option><option value="percentile">percentile</option></select></label>
                    <label>value<select id="scale-value"><option value="component">component</option><option value="magnitude">magnitude</option></select></label>
                    <label>component<input id="scale-component" type="number" step="1" min="0" max="3" value="3"></label>
                    <label>domain min<input id="scale-domain-min" type="number" step="any" value="0.001"></label>
                    <label>domain max<input id="scale-domain-max" type="number" step="any" value="1000"></label>
                    <label>clamp min<input id="scale-clamp-min" type="number" step="any" value="0.001"></label>
                    <label>clamp max<input id="scale-clamp-max" type="number" step="any" value="1000"></label>
                    <label>p low (%)<input id="scale-percentile-low" type="number" step="0.1" min="0" max="100" value="2"></label>
                    <label>p high (%)<input id="scale-percentile-high" type="number" step="0.1" min="0" max="100" value="98"></label>
                    <label>log base<input id="scale-log-base" type="number" step="any" min="1.000001" value="10"></label>
                    <label>symlog lin<input id="scale-symlog" type="number" step="any" min="0.000001" value="1"></label>
                    <label>gamma<input id="scale-gamma" type="number" step="any" min="0.000001" value="1"></label>
                    <label>invert<input id="scale-invert" type="checkbox"></label>
                    <label>hist bins<input id="scale-bins" type="number" step="1" min="16" value="2048"></label>
                    <button class="wide" id="scale-apply">apply transform + colormap</button>
                    <button class="wide" id="scale-stats">GPU min/max -> domain</button>
                    <button class="wide" id="scale-stats-p">GPU percentiles -> clamp</button>
                    <button class="wide" id="scale-invalidate">invalidate stats cache</button>
                </div>
                <div id="scale-status"></div>`;

                ui.colormap = scaleHud.querySelector("#scale-colormap");
                ui.mode = scaleHud.querySelector("#scale-mode");
                ui.clampMode = scaleHud.querySelector("#scale-clamp");
                ui.valueMode = scaleHud.querySelector("#scale-value");
                ui.componentIndex = scaleHud.querySelector("#scale-component");
                ui.domainMin = scaleHud.querySelector("#scale-domain-min");
                ui.domainMax = scaleHud.querySelector("#scale-domain-max");
                ui.clampMin = scaleHud.querySelector("#scale-clamp-min");
                ui.clampMax = scaleHud.querySelector("#scale-clamp-max");
                ui.percentileLow = scaleHud.querySelector("#scale-percentile-low");
                ui.percentileHigh = scaleHud.querySelector("#scale-percentile-high");
                ui.logBase = scaleHud.querySelector("#scale-log-base");
                ui.symlogLinThresh = scaleHud.querySelector("#scale-symlog");
                ui.gamma = scaleHud.querySelector("#scale-gamma");
                ui.invert = scaleHud.querySelector("#scale-invert");
                ui.histogramBins = scaleHud.querySelector("#scale-bins");
                ui.status = scaleHud.querySelector("#scale-status");

                scaleHud.querySelector("#scale-apply").addEventListener("click", applyScaleTransformFromUI);
                scaleHud.querySelector("#scale-stats").addEventListener("click", () => requestScaleStats(false));
                scaleHud.querySelector("#scale-stats-p").addEventListener("click", () => requestScaleStats(true));
                scaleHud.querySelector("#scale-invalidate").addEventListener("click", invalidateScaleCache);
            };

            const updateProjection = () => {
                if (activeCamera.type === "perspective") activeCamera.updateAspect(Math.max(1, canvas.clientWidth), Math.max(1, canvas.clientHeight));
            };

            const fitCurrent = (view = currentView, animate = true) => {
                updateProjection();
                if (view) controls.viewBounds(view, scene, { animate, duration: 0.5, padding: 1.2 });
                else controls.fitScene(scene, { animate, duration: 1.0, padding: 1.0 });
            };

            const switchCamera = (nextCamera) => {
                if (nextCamera === activeCamera) return;
                nextCamera.transform.copyFrom(activeCamera.transform);
                activeCamera = nextCamera;
                controls.setCamera(activeCamera);
                updateProjection();
                fitCurrent(currentView, true);
                updateHud();
            };

            const updateHud = () => {
                navHud.textContent = [
                    "Scaling & Colormap",
                    `mode: ${controls.mode}`,
                    `camera: ${activeCamera.type}`,
                    `view: ${currentView}`,
                    "",
                    "1 orbit | 2 trackball",
                    "W/S/A/D/Q/E views | X fit | C camera",
                ].join("\n");
            };

            window.addEventListener("keydown", (event) => {
                const targetTag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : "";
                if (targetTag === "input" || targetTag === "select" || targetTag === "textarea") return;
                const key = event.key.toLowerCase();
                if (key === "1") controls.setMode("orbit");
                else if (key === "2") controls.setMode("trackball");
                else if (key === "w") { currentView = "front"; fitCurrent(currentView, true); }
                else if (key === "s") { currentView = "back"; fitCurrent(currentView, true); }
                else if (key === "a") { currentView = "left"; fitCurrent(currentView, true); }
                else if (key === "d") { currentView = "right"; fitCurrent(currentView, true); }
                else if (key === "q") { currentView = "top"; fitCurrent(currentView, true); }
                else if (key === "e") { currentView = "bottom"; fitCurrent(currentView, true); }
                else if (key === "x") fitCurrent(currentView, true);
                else if (key === "c") switchCamera(activeCamera === perspective ? orthographic : perspective);
                else return;
                updateHud();
            });

            window.addEventListener("resize", updateProjection);
            setupScalePane();
            updateProjection();
            fitCurrent(currentView, false);
            applyScaleTransformFromUI();
            refreshScalePane();
            updateHud();

            wgpu.run((dt) => {
                updateProjection();
                controls.update(dt);
                wgpu.render(scene, activeCamera);
            });
        </script>
    </body>
</html>
