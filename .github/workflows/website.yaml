name: Website

on:
  push:
    branches:
      - main
    paths:
      - website/**
      - assets/**
      - scripts/build_website.py
      - mkdocs.yaml
      - .github/workflows/website.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      -
        name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs
          pip install mkdocs-material
          pip install mkdocs-panzoom-plugin
      -
        name: Build website
        run: python ./scripts/build_website.py
      -
        name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/build/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      -
        name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
