name: Test

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - rust/**
      - test/**
      - examples/**
      - scripts/serve-tests.js
      - scripts/merge-test-reports.js
      - scripts/build-rust-wasm.js
      - build/**
      - dist/**
      - .cargo/**
      - .github/workflows/test.yaml
      - esbuild.config.js
      - playwright.config.js
      - package.json
      - package-lock.json
      - tsconfig.json
      - ARCHITECTURE.md

  pull_request:
    branches:
      - main
    paths:
      - src/**
      - rust/**
      - test/**
      - examples/**
      - scripts/serve-tests.js
      - scripts/merge-test-reports.js
      - scripts/build-rust-wasm.js
      - build/**
      - dist/**
      - .cargo/**
      - .github/workflows/test.yaml
      - esbuild.config.js
      - playwright.config.js
      - package.json
      - package-lock.json
      - tsconfig.json
      - ARCHITECTURE.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11
            os: windows-2025
          - name: MacOS 15
            os: macos-15-intel
          - name: Ubuntu 24
            os: ubuntu-24.04

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      -
        name: Install Node dependencies
        run: npm ci

      -
        name: Install Playwright dependencies
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install-deps chromium

      -
        name: Install Chromium
        run: npx playwright install --no-shell chromium

      -
        name: Install Vulkan driver
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          LAVAPIPE_ICD=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$LAVAPIPE_ICD"
          echo "VK_DRIVER_FILES=$LAVAPIPE_ICD" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$LAVAPIPE_ICD" vulkaninfo --summary

      -
        name: Install Rust dependencies
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt

      -
        name: Build WasmGPU
        run: npm run build

      -
        name: Prepare test reports
        id: prepare
        run: npm run test:clean

      -
        name: Run Rust tests
        run: |
          cargo fmt --manifest-path ./rust/Cargo.toml -- --check
          npm run test:rs

      -
        name: Run setup tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && runner.os != 'Linux' }}
        run: npm run test:setup

      -
        name: Run setup tests with Xvfb
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm run test:setup -- --headed
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      -
        name: Run Node tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && runner.os != 'Linux' }}
        run: npm run test:js

      -
        name: Run Node tests with Xvfb
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm run test:js -- --headed
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      -
        name: Run examples tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && runner.os != 'Linux' }}
        run: npm run test:ex

      -
        name: Run examples tests with Xvfb
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm run test:ex -- --headed
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      -
        name: Merge test reports
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run test:merge

      -
        name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
            blob-report/
          retention-days: 7
